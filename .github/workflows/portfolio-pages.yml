name: Deploy peachily portfolio
# Manual only: pushing a commit does not publish this site.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare buildless static files
        run: |
          mkdir _portfolio_site
          cp B1-1/index.html B1-1/CNAME B1-1/.nojekyll _portfolio_site/
          cp -R B1-1/css B1-1/js B1-1/assets _portfolio_site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _portfolio_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
